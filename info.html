<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OFIRSEC Portal</title>
    
    <script type="text/javascript" src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
    
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
            color: #323130;
        }

        #container {
            padding: 25px 20px;
            display: flex;
            flex-direction: column;
        }

        .header {
            margin-bottom: 25px;
            text-align: right;
            border-bottom: 1px solid #edebe9;
            padding-bottom: 20px;
        }

        .header h2 {
            font-size: 20px;
            font-weight: 700;
            margin: 0;
            color: #0078d4;
        }

        .subtitle {
            font-size: 13.5px;
            color: #605e5c;
            margin-top: 10px;
            line-height: 1.6;
        }

        #button-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .request-btn {
            background-color: #fcfcfc;
            color: #323130;
            border: 1px solid #e1dfdd;
            border-radius: 8px;
            padding: 16px 20px;
            text-align: right;
            font-size: 14.5px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
            display: block;
            width: 100%;
        }

        .request-btn:hover {
            background-color: #eff6fc;
            border-color: #0078d4;
            color: #0078d4;
            transform: translateX(-5px);
            box-shadow: 0 4px 10px rgba(0,120,212,0.15);
        }

        .footer {
            margin-top: 40px;
            text-align: center;
            padding-bottom: 20px;
        }
        
        .footer img {
            width: 150px;
            height: auto;
        }
    </style>
</head>
<body>

<div id="container">
    <div class="header">
        <h2>מרכז פניות אבטחת מידע – OFIRSEC</h2>
        <p class="subtitle">
            ברוכים הבאים לממשק הבקשות המהיר. כאן תוכלו להגיש פניות בנושאי שינויים, הרשאות ותהליכי אבטחה בצורה מסודרת ויעילה. 
            <br><br>
            בחירת סוג הפנייה תייצר עבורכם <strong>פורמט דיווח אוטומטי</strong> שיבטיח טיפול מהיר ומקצועי בהתאם לנהלי הארגון.
        </p>
    </div>
    
    <div id="button-list"></div>

    <div class="footer">
        <img src="https://ofirsec.co.il/wp-content/uploads/2024/06/logo-big-cyber-1-1-768x336.png" alt="OFIRSEC">
    </div>
</div>

<script type="text/javascript" src="info.js"></script>

</body>
</html>
